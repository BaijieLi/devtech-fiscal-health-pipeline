[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devtech-fiscal-health-pipeline"
version = "0.1.0"
description = "Prototype pipeline for extracting municipal financial data and computing fiscal health ratios."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2.0",
  "pdfplumber>=0.11.0",
]

[project.scripts]
fiscal-health-ratios = "fiscal_health_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
